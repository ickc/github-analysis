[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-analysis"
version = "0.1.0"
description = "Reusable tools for GitHub Actions metrics analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["github", "actions", "metrics", "analysis", "dashboard"]
dependencies = [
    "typer>=0.9",
    "pandas>=2.0",
    "plotly>=6.0",
    "PyGithub>=2.8",
    "rich>=13.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
github-analysis = "github_analysis.cli:app"

[project.urls]
Homepage = "https://github.com/ickc/github-analysis"
Repository = "https://github.com/ickc/github-analysis"
Issues = "https://github.com/ickc/github-analysis/issues"

[dependency-groups]
dev = [
    "build>=1.3",
    "twine>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/github_analysis"]

[tool.uv]
package = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "linux-ppc64le", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.15"
typer = ">=0.9"
pandas = ">=2.0"
plotly = ">=6.0"
pygithub = ">=2.8"
rich = ">=13.0"

[tool.pixi.pypi-dependencies]
github-analysis = { path = ".", editable = true }

[tool.pixi.tasks]
check = { cmd = "python -m compileall src bin", description = "Compile Python sources." }
help = { cmd = "github-analysis --help", description = "Show the CLI help." }

[tool.pixi.environments]
default = { solve-group = "default" }
